name: arm64-emulator-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact probe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Record host and KVM state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "HOST_UNAME=$(uname -a)"
            echo "HOST_ARCH=$(uname -m)"
            if [[ -e /dev/kvm ]]; then
              ls -l /dev/kvm
              echo "KVM_PRESENT=true"
            else
              echo "KVM_PRESENT=false"
            fi
          } | tee evidence/host.txt

      - name: Enable KVM for the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Start isolated ARM64 AVD and read readiness
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          disable-animations: true
          script: |
            adb wait-for-device
            echo "BOOT_COMPLETED=$(adb shell getprop sys.boot_completed | tr -d '\r')" > evidence/device.txt
            echo "PRODUCT_ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" >> evidence/device.txt
            echo "PRODUCT_ABILIST=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')" >> evidence/device.txt
            echo "ANDROID_RELEASE=$(adb shell getprop ro.build.version.release | tr -d '\r')" >> evidence/device.txt
            echo "SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')" >> evidence/device.txt
            echo "MODEL=$(adb shell getprop ro.product.model | tr -d '\r')" >> evidence/device.txt
            adb devices -l >> evidence/device.txt
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell getprop ro.product.cpu.abilist | tr -d '\r' | grep -Eq 'arm64-v8a|armeabi-v7a'
            echo "ANDROID_ARM64_EMULATOR_PROBE_PASS" | tee evidence/marker.txt

      - name: Upload non-sensitive readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-emulator-probe-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 1
